apiVersion: v1
kind: Service
metadata:
  name: {{ include "ted.fullname" . }}
  labels:
    {{- include "ted.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ted.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
